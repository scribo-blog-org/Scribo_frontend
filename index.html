<!DOCTYPE html>
<html lang="ru" style="background-color: #161616; color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var isDark = true;
        try {
          var stored = localStorage.getItem("theme");
          if (stored !== null) isDark = JSON.parse(stored);
        } catch (e) {}
        var html = document.documentElement;
        html.style.backgroundColor = isDark ? "#161616" : "#f1f1f1";
        html.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Scribo — платформа для публикации статей, обсуждений и личных блогов."
    />

    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <meta name="google-site-verification" content="DTQfYT7mIYFPFnKk3UInD6ltH9cjE3S7aNtQ1oOZdJI" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scribo" />
    <meta property="og:locale" content="ru_RU" />

    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Scribo</title>
  </head>

  <body>
    <script>
      (function () {
        var isDark = true;
        try {
          var stored = localStorage.getItem("theme");
          if (stored !== null) isDark = JSON.parse(stored);
        } catch (e) {}
        document.body.classList.toggle("dark-theme", isDark);
      })();
    </script>
    <noscript>You need to enable JavaScript to run Scribo.</noscript>

    <div id="root"></div>

    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
